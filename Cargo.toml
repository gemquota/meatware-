[package]
name = "meatware"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic abstract substrate reference runtime"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
