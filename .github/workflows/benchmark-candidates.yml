name: Compare reference runtime candidates
on:
  push:
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark-candidates.yml"
  pull_request:
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark-candidates.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile C++ candidate
        run: g++ -O3 -DNDEBUG -std=c++20 benchmarks/cpp/main.cpp -o /tmp/meatware-cpp
      - name: Build Rust candidate
        run: cargo build --release --manifest-path benchmarks/rust/Cargo.toml
      - name: Run candidates
        run: |
          /tmp/meatware-cpp > /tmp/cpp.json
          cargo run --quiet --release --manifest-path benchmarks/rust/Cargo.toml > /tmp/rust.json
          cat /tmp/cpp.json
          cat /tmp/rust.json
      - name: Check semantic parity
        run: python benchmarks/compare.py /tmp/cpp.json /tmp/rust.json
