name: Validate project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canon, manifest, credits, task registry, schemas, and local links
        run: python scripts/validate_project.py
      - name: Validate agent task discovery and dependency graph
        run: python scripts/agent_tasks.py validate-registry --json
      - name: Smoke-test ready-task discovery
        run: python scripts/agent_tasks.py ready --json
