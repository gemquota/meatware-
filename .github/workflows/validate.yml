name: Validate project foundations

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate project documentation
        run: python scripts/validate_docs.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check browser module syntax
        run: |
          python -c 'import re; h=open("site/index.html").read(); s=re.findall(r"<script type=\"module\">(.*?)</script>", h, re.S); assert len(s)==1; open("/tmp/meatware-site.mjs", "w").write(s[0])'
          node --check /tmp/meatware-site.mjs
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        run: cargo test --all-targets
      - name: Run reference runtime
        run: cargo run --release
