name: Submit a contribution
description: Submit feedback, critique, continuity findings, or non-exclusive suggestions
title: "[Contribution] "
body:
  - type: input
    id: task
    attributes:
      label: Task ID
      description: Use the task ID if this responds to an existing task.
      placeholder: PHASE1-XXX or CONTRIB-XXX
    validations:
      required: false
  - type: dropdown
    id: type
    attributes:
      label: Contribution type
      options:
        - Continuity review
        - Character / voice feedback
        - Alternate joke suggestions
        - Production / benchmark critique
        - Documentation / onboarding feedback
        - Tooling / automation feedback
        - Other feedback
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Contribution
      description: Submit feedback or clearly non-exclusive suggestions. Until rights are resolved, do not submit finished scripts, artwork, music, performances, or production assets for incorporation.
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions and canon conflicts
      description: Identify anything you invented or could not reconcile.
    validations:
      required: false
  - type: input
    id: attribution
    attributes:
      label: Preferred public attribution
      description: GitHub handle is fine. Do not include private contact details.
    validations:
      required: false
  - type: input
    id: tools
    attributes:
      label: Tools used (optional)
      placeholder: ChatGPT, local agent, editing software, etc.
    validations:
      required: false
