name: Propose a new task
description: Suggest a bounded task for the project
title: "[Task proposal] "
body:
  - type: textarea
    id: goal
    attributes:
      label: One-sentence goal
      description: What concrete output should this task produce?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and source material
      description: Link the relevant canon or production documents.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will a reviewer know the task is complete?
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Estimated effort
      options:
        - 10–20 minutes
        - 30–60 minutes
        - 2–4 hours
        - Larger / needs decomposition
    validations:
      required: true
